/* Speech Recognition */
var rec=null,isRec=false;
function toggleSpeech(){
  var btn=$("micBtn"),nt=$("nt");
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    alert("خاصية الإملاء الصوتي مش مدعومة في المتصفح ده، جرب متصفح Chrome.");return;
  }
  if(isRec){if(rec)rec.stop();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();
  rec.lang='ar-EG';
  rec.continuous=true;
  rec.interimResults=false;
  rec.onstart=function(){isRec=true;btn.classList.add("rec");btn.innerHTML="🔴 بيسمعك...";};
  rec.onresult=function(e){
    var txt="";
    for(var i=e.resultIndex;i<e.results.length;++i){
      if(e.results[i].isFinal)txt+=e.results[i][0].transcript;
    }
    if(txt){nt.value=(nt.value?(nt.value+" "):"")+txt;}
  };
  rec.onerror=function(e){console.error(e);isRec=false;btn.classList.remove("rec");btn.innerHTML="🎙️ اتكلم بالمصري";};
  rec.onend=function(){isRec=false;btn.classList.remove("rec");btn.innerHTML="🎙️ اتكلم بالمصري";};
  rec.start();
}
